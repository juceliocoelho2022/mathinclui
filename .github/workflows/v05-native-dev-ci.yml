name: v0.5 Native Dev CI

on:
  push:
    branches:
      - worktree/v0.5-native

jobs:
  backend:
    if: contains(github.event.head_commit.message, '[backend]') || contains(github.event.head_commit.message, '[all]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: mvn -B test

  frontend:
    if: contains(github.event.head_commit.message, '[frontend]') || contains(github.event.head_commit.message, '[all]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  structural:
    if: contains(github.event.head_commit.message, '[structural]') || contains(github.event.head_commit.message, '[all]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Structural verification
        run: |
          python scripts/verify_project.py
          python scripts/verify_v03.py
          python scripts/verify_v04.py
