spring:
  application:
    name: mathinclui
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mathinclui}
    username: ${DB_USER:mathinclui}
    password: ${DB_PASSWORD:mathinclui_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl-seconds: ${JWT_ACCESS_TTL:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL:604800}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      block-seconds: ${LOGIN_BLOCK_SECONDS:900}
    password-reset:
      ttl-seconds: ${PASSWORD_RESET_TTL:1800}
      log-token: ${PASSWORD_RESET_LOG_TOKEN:false}
